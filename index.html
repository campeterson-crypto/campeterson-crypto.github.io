<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cameron Peterson</title>
<meta name="description" content="Cameron Peterson, MBA candidate at UC Berkeley Haas. Projects, AI prompting tools, and CV.">
<link rel="canonical" href="https://campeterson-crypto.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cameron Peterson">
<meta property="og:title" content="Cameron Peterson">
<meta property="og:description" content="Cameron Peterson, MBA candidate at UC Berkeley Haas. Projects, AI prompting tools, and CV.">
<meta property="og:url" content="https://campeterson-crypto.github.io/">
<meta property="og:image" content="https://campeterson-crypto.github.io/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

</head>
<body><main id="m" class="home"></main><script src="site.js?v=12"></script><script src="sandwiches.js?v=10"></script><script>
shell("Home");
const card=t=>`<a class="card" href="${t.url}"><span class="k">${t.k||"Tool"}</span><span class="t">${t.title}</span><span class="d">${t.desc}</span><span class="go">Open →</span></a>`;
m.innerHTML=
 band(`<div class="hero-grid">
 <div class="hero-copy">
  <a class="new" href="private-credit.html"><b>New</b>Private Credit 101 →</a>
  <h1 class="display">${SITE.name}</h1>
  <p class="intro">${SITE.intro}</p>
  <ul class="pills hero-pills"><li>Berkeley Haas MBA ’28</li><li>Finance &amp; fintech</li><li>Skier</li><li>Fly fisher</li><li>Sandwich hunter</li></ul>
 </div>
 <div class="hero-photo"><img src="${SITE.photo}" alt="${SITE.name}" width="320" height="320"></div>
</div>`,"hero")
+band(`<p class="eyebrow">Timeline</p><ol class="tl">${[
  ["Through 2018","Boulder High School","Boulder, CO","Where it all started"],
  ["2018 – 2021","CU Boulder, Leeds","Boulder, CO","Finance and real estate degree"],
  ["2021 – 2023","Deloitte FP&amp;A","Denver, CO","Analyst on the Alphabet account"],
  ["2023 – 2025","Deloitte FP&amp;A","New York, NY","Consultant leading a US and India team"],
  ["2025 – 2026","Churchill","New York, NY","Private credit fund modeling"],
  ["2026 – now","Berkeley Haas","Berkeley, CA","First-year, full-time MBA"]
 ].map((s,i,a)=>`<li${i==a.length-1?' class="now"':''}><span class="when">${s[0]}</span><b>${s[1]}</b><span class="where">${s[2]}</span><span class="blurb">${s[3]}</span></li>`).join("")}</ol>`,"tl-band")
+band(`<a class="eyebrow" href="projects.html">Projects</a><h2>See what I'm building</h2><a class="btn" href="projects.html">View projects →</a>`)
+band(`<a class="eyebrow" href="projects.html">AI Prompting Toolkit</a><h2>Tools for writing better prompts</h2><div class="cards">${SITE.tools.map(card).join("")}</div>`)
+band(`<a class="eyebrow" href="budget.html">Personal Finance</a><h2>Plan where your money goes</h2><div class="cards">${SITE.finance.map(card).join("")}</div>`)
+band(`<a class="eyebrow" href="private-credit.html">Private Credit 101</a><h2>How the money actually moves</h2><div class="cards">${SITE.explainers.map(card).join("")}</div>`)
+(()=>{const s=sandwichWeek().shop;return band(`<a class="eyebrow" href="sandwich.html">Sandwich Shop of the Week</a><h2>${esc(s.name)}</h2><p class="lede" style="margin-bottom:20px">${esc(s.hood)}, ${esc(s.city)} · Order the ${esc(s.items[0][0])}. A new San Francisco or Berkeley sandwich shop every Monday.</p><a class="btn" href="sandwich.html">See this week's pick →</a>`)})()
+band(`<a class="eyebrow" href="sports.html">Sports</a><h2>Chargers, Nuggets, Avs and Buffs</h2><p class="lede" style="margin-bottom:20px">Live headlines, records and next games for the teams I follow.</p><a class="btn" href="sports.html">Latest news →</a>`)
+(SITE.essays.length?band(`<a class="eyebrow" href="essays.html">Essays</a><h2>Writing and ideas</h2><a class="btn" href="essays.html">Read my essays →</a>`):"")
+band(`<a class="eyebrow" href="cv.html">CV</a><h2>Experience and education</h2><div class="btns"><a class="btn" href="cv.html">View my CV →</a><a class="btn ghost" href="${SITE.linkedin}">LinkedIn ↗</a></div>`);
</script></body></html>
